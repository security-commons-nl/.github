name: Pages voor documentatierepo's (herbruikbaar)

# Herbruikbare workflow die een documentatierepo als statische site naar GitHub Pages bouwt
# en publiceert.
#
# Twee smaken, en de workflow kiest zelf:
#
#   1. De repo heeft `site/build.mjs`. Dan draait die, zoals altijd (`npm ci` + `node site/build.mjs`).
#      Zo blijven normen, csir-assessment-tool, applicatiecheck, ai-gebruik-in-beeld en
#      Handelingsperspectief werken zolang ze hun eigen kopie hebben.
#   2. De repo heeft alleen `site/config.json`. Dan checkt deze workflow security-commons-nl/.github
#      uit en draait de gedeelde build daaruit met SITE_ROOT op de aanroepende repo. De repo hoeft
#      dan geen build, geen package.json en geen node_modules te onderhouden.
#
# Waarom: de bouwstappen zijn in elke documentatierepo gelijk, en vijf kopieen van hetzelfde script
# liepen aantoonbaar uit elkaar (de een kreeg downloads, de ander verborg de tabbalk bij een enkele
# tab). Smaak 2 is de bestemming; smaak 1 is de overgang.
#
# Gebruik in caller-repo (.github/workflows/pages.yml). De caller bepaalt zelf de triggers en
# moet de Pages-permissies en concurrency meegeven; die kunnen niet vanuit deze workflow
# worden afgedwongen:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     pages: write
#     id-token: write
#   concurrency:
#     group: pages
#     cancel-in-progress: true
#   jobs:
#     pages:
#       uses: security-commons-nl/.github/.github/workflows/pages-docs.yml@main

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Eigen build of de gedeelde?
        id: keuze
        run: |
          if [ -f site/build.mjs ]; then
            echo "eigen=ja" >> "$GITHUB_OUTPUT"
          else
            test -f site/config.json || { echo "::error::site/config.json ontbreekt; zonder eigen build is dat het enige wat deze repo moet leveren"; exit 1; }
            echo "eigen=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: De gedeelde build ophalen
        if: steps.keuze.outputs.eigen == 'nee'
        uses: actions/checkout@v6
        with:
          repository: security-commons-nl/.github
          path: .sitebuild

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.keuze.outputs.eigen == 'ja' && 'package-lock.json' || '.sitebuild/package-lock.json' }}

      - name: Bouwen met de eigen build
        if: steps.keuze.outputs.eigen == 'ja'
        run: |
          npm ci
          node site/build.mjs

      - name: Bouwen met de gedeelde build
        if: steps.keuze.outputs.eigen == 'nee'
        env:
          SITE_ROOT: ${{ github.workspace }}
        run: |
          npm ci --prefix .sitebuild
          node .sitebuild/site/build.mjs

      - name: Er moet een pagina uit komen
        run: test -s dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
