name: Tests van de controlescripts

on:
  push:
    branches: [main]
    paths: ["tools/**", "site/**", "package*.json", ".github/workflows/tools-ci.yml"]
  pull_request:
    paths: ["tools/**", "site/**", "package*.json"]

jobs:
  tests:
    uses: security-commons-nl/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      test-command: "python -m pytest tools/ -v"
      install-extras: "pytest"

  # De gedeelde leesversie-build draait op node; python-ci.yml kent dat niet, dus die tests krijgen
  # een eigen job. Zonder node_modules slaan ze zichzelf over, en dan zou de bouw stil ongetest zijn.
  leesversie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tools/test_leesversie.py -v
